[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tman"
version = "0.3.0"
description = "Supervised process/test runner — caps, culls, and reaps runaway processes from AI coding agents (native binary)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["process-manager", "test-runner", "supervisor", "timeout", "watchdog", "orphan-reaper", "ai-agent", "ci", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://standardbeagle.github.io/tman/"
Documentation = "https://standardbeagle.github.io/tman/docs/"
Source = "https://github.com/standardbeagle/tman"
Changelog = "https://github.com/standardbeagle/tman/blob/main/CHANGELOG.md"
Issues = "https://github.com/standardbeagle/tman/issues"

[project.scripts]
tman = "tman._run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tman"]
